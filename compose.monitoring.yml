services:
  prometheus:
    image: prom/prometheus:v3.2.1
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=15d,
      ]
    volumes:
      [
        ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro,
        ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro,
        monitor-secrets:/run/launchcheck:ro,
        prometheus-data:/prometheus,
      ]
    ports: [127.0.0.1:9090:9090]
    networks: [backend, monitoring]
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      [
        ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,
        alertmanager-data:/alertmanager,
      ]
    ports: [127.0.0.1:9093:9093]
    networks: [backend, monitoring]
    restart: unless-stopped
networks:
  monitoring: {}
volumes:
  prometheus-data:
  alertmanager-data:
