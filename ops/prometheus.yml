global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: launchcheck
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/launchcheck/metrics_token
    static_configs: [{ targets: ["api:8080"] }]
