services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    networks: [backend]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  rabbit:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: launchcheck
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    networks: [backend]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    ports: ["127.0.0.1:8080:8080"]
    environment:
      MONGO_URI: mongodb://mongo:27017/launchcheck
      RABBIT_URL: amqp://launchcheck:${RABBIT_PASSWORD}@rabbit:5672
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
    volumes: [audit-artifacts:/data/artifacts:ro]
    networks: [backend]
    depends_on:
      mongo: {condition: service_healthy}
      rabbit: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    environment:
      MONGO_URI: mongodb://mongo:27017/launchcheck
      RABBIT_URL: amqp://launchcheck:${RABBIT_PASSWORD}@rabbit:5672
    volumes: [audit-artifacts:/data/artifacts]
    networks: [backend, egress]
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    depends_on:
      mongo: {condition: service_healthy}
      rabbit: {condition: service_healthy}
    restart: unless-stopped
networks:
  backend: {internal: true}
  egress: {}
volumes:
  mongo-data:
  rabbit-data:
  audit-artifacts:
